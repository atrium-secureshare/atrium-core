name: release-please

# Maintains a release PR from Conventional Commits on main. Merging that PR
# tags the release, creates the GitHub Release and updates CHANGELOG.md, and
# then builds the container image, pushes it to the GitHub Container Registry
# and attaches a signed SBOM to it. The image build lives in this workflow
# rather than reacting to the release event: releases created with the default
# GITHUB_TOKEN do not trigger further workflow runs, so a separate
# release-triggered workflow would never start (and working around that would
# mean maintaining a PAT).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: go

      - if: steps.release.outputs.release_created
        uses: actions/checkout@v7

      - if: steps.release.outputs.release_created
        uses: docker/setup-buildx-action@v4

      - if: steps.release.outputs.release_created
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.release.outputs.release_created
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The run is on a branch push, not a tag ref, so the version has to be
          # fed in explicitly. latest=auto (the metadata-action default) adds
          # :latest for non-prerelease versions.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag_name }}

      - id: build
        if: steps.release.outputs.release_created
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: steps.release.outputs.release_created
        uses: anchore/sbom-action/download-syft@v0

      # The image scan names no npm packages, since the SPA is embedded in the
      # binary, so those come from the lockfile and both scans are merged.
      - name: Generate the SBOM
        if: steps.release.outputs.release_created
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          curl -sSfL -o cyclonedx https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64
          chmod +x cyclonedx
          syft "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" \
            --from registry -o cyclonedx-json=image.cdx.json
          syft dir:web --override-default-catalogers javascript-lock-cataloger \
            --source-name atrium-core-web --source-version "$TAG" \
            -o cyclonedx-json=web.cdx.json
          ./cyclonedx merge --input-files image.cdx.json web.cdx.json \
            --output-file sbom.cdx.json

      - name: Attest the SBOM to the image
        if: steps.release.outputs.release_created
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
