name: release-please

# Maintains a release PR from Conventional Commits on main. Merging that PR
# tags the release, creates the GitHub Release and updates CHANGELOG.md, and
# then builds the container image and pushes it to the GitHub Container
# Registry. The image build lives in this workflow rather than reacting to the
# release event: releases created with the default GITHUB_TOKEN do not trigger
# further workflow runs, so a separate release-triggered workflow would never
# start (and working around that would mean maintaining a PAT).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: go

      - if: steps.release.outputs.release_created
        uses: actions/checkout@v7

      - if: steps.release.outputs.release_created
        uses: docker/setup-buildx-action@v4

      - if: steps.release.outputs.release_created
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.release.outputs.release_created
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The run is on a branch push, not a tag ref, so the version has to be
          # fed in explicitly. latest=auto (the metadata-action default) adds
          # :latest for non-prerelease versions.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag_name }}

      - if: steps.release.outputs.release_created
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
