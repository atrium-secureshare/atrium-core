version: 2

# Commit-message prefixes feed release-please: dependency updates use "fix"
# (→ patch release, shows in the changelog), including npm dev-dependencies
# since they build the shipped assets. Only workflow updates use "chore"
# (no release). Every PR is assigned to jbrunner; the auto-merge workflow
# merges semver-minor/patch once CI is green.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - jbrunner
    commit-message:
      prefix: fix

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - jbrunner
    commit-message:
      prefix: fix
    # react and react-dom must carry the exact same version or react-dom throws
    # at mount, so bump them together in a single PR rather than in separate ones.
    groups:
      react:
        patterns:
          - react
          - react-dom

  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - jbrunner
    commit-message:
      prefix: fix

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - jbrunner
    commit-message:
      prefix: fix

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - jbrunner
    commit-message:
      prefix: chore
